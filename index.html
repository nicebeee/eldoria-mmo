<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Хроники Эльдории</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E⚔️%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@600;700&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet" />
</head>
<body>
  <!-- ============ ЭКРАН ВХОДА / РЕГИСТРАЦИИ ============ -->
  <div id="auth-screen">
    <div class="auth-bg"><div class="mist"></div><div class="embers"></div></div>
    <div class="auth-wrap">
      <div class="auth-panel">
        <h1 class="logo">Хроники<span>Эльдории</span></h1>
        <div class="tabs">
          <button data-tab="login" class="active">Вход</button>
          <button data-tab="register">Новый герой</button>
        </div>

        <form id="login-form" autocomplete="on">
          <label>Имя героя<input id="login-user" autocomplete="username" required /></label>
          <label>Пароль<input id="login-pass" type="password" autocomplete="current-password" required /></label>
          <button class="btn gold big" type="submit">Войти в мир</button>
          <div id="hero-list"></div>
        </form>

        <form id="register-form" class="hidden" autocomplete="off">
          <label>Имя героя<input id="reg-user" maxlength="16" required placeholder="3–16 символов" /></label>
          <div class="row2">
            <label>Пароль<input id="reg-pass" type="password" autocomplete="new-password" required /></label>
            <label>Повтор пароля<input id="reg-pass2" type="password" autocomplete="new-password" required /></label>
          </div>
          <div class="lbl">Класс</div>
          <div id="class-cards"></div>
          <div id="class-info"></div>
          <button class="btn gold big" type="submit">Создать героя</button>
        </form>
        <div id="auth-error"></div>
      </div>
      <div class="preview-box"><canvas id="preview-canvas"></canvas></div>
    </div>
  </div>

  <div id="loading" class="hidden"><div class="spinner"></div>Создание мира…</div>

  <!-- ============ ИГРА ============ -->
  <div id="game" class="hidden">
    <canvas id="game-canvas"></canvas>
    <div id="float-layer"></div>

    <div id="hud">
      <div id="player-frame" class="frame">
        <div id="pf-portrait"></div>
        <div class="pf-main">
          <div class="pf-top"><span id="pf-name"></span><span class="pf-lvl">ур. <b id="pf-level">1</b></span><span id="pf-combat" title="В бою">⚔</span></div>
          <div id="hp-bar" class="bar hp"><div class="fill"></div><div class="txt"></div></div>
          <div id="mp-bar" class="bar mp"><div class="fill"></div><div class="txt"></div></div>
          <div id="buffs"></div>
        </div>
      </div>

      <div id="target-frame" class="frame hidden">
        <div class="tf-top"><span class="tf-lvl" id="tf-level"></span><span id="tf-name"></span><span id="tf-dist"></span></div>
        <div id="tf-hp" class="bar hp"><div class="fill"></div><div class="txt"></div></div>
      </div>

      <div id="minimap-wrap">
        <canvas id="minimap" width="170" height="170"></canvas>
        <div id="zone-name"></div>
        <div id="coords"></div>
      </div>

      <div id="quest-tracker"></div>

      <div id="menu-buttons">
        <button id="btn-char" data-open="character" title="Персонаж (C)">🛡️<kbd>C</kbd></button>
        <button data-open="inventory" title="Сумка (I)">🎒<kbd>I</kbd></button>
        <button data-open="quests" title="Задания (L)">📜<kbd>L</kbd></button>
        <button id="btn-exit" title="Сохранить и выйти">🚪</button>
      </div>

      <div id="bottom">
        <div id="action-bar"></div>
        <div id="xp-bar"><div id="xp-fill"></div><div id="xp-text"></div></div>
      </div>

      <div id="chat">
        <div id="chat-log"></div>
        <input id="chat-input" placeholder="Enter — написать сообщение, /help — управление" maxlength="120" autocomplete="off" />
      </div>

      <div id="interact-prompt" class="hidden"></div>
      <div id="error-msg"></div>
      <div id="banner"></div>

      <!-- окна -->
      <div class="window hidden" id="win-character" data-win="character">
        <div class="win-head">Персонаж <button class="close">✕</button></div>
        <div class="win-body" id="char-body"></div>
      </div>

      <div class="window hidden" id="win-inventory" data-win="inventory">
        <div class="win-head">Сумка <button class="close">✕</button></div>
        <div class="win-body">
          <div id="inv-grid"></div>
          <div class="inv-foot"><span>🪙 <b id="inv-gold">0</b></span><span class="muted">Свободно: <b id="inv-free">0</b></span></div>
        </div>
      </div>

      <div class="window hidden" id="win-quests" data-win="quests">
        <div class="win-head">Журнал заданий <button class="close">✕</button></div>
        <div class="win-body scroll" id="quests-body"></div>
      </div>

      <div class="window hidden" id="win-dialog" data-win="dialog">
        <div class="win-head"><span id="dialog-title"></span> <button class="close">✕</button></div>
        <div class="win-body" id="dialog-body"></div>
      </div>

      <div class="window hidden" id="win-shop" data-win="shop">
        <div class="win-head">Лавка Гаспара <button class="close">✕</button></div>
        <div class="win-body">
          <div id="shop-list"></div>
          <div class="inv-foot"><span>🪙 <b id="shop-gold">0</b></span><span class="muted">ПКМ по предмету в сумке — продать</span></div>
        </div>
      </div>

      <div id="death-screen" class="hidden">
        <div class="death-box">
          <h2>Вы погибли</h2>
          <p>Тьма сомкнулась над вами… но ваш путь ещё не окончен.</p>
          <button class="btn gold big" id="respawn-btn">Воскреснуть в деревне</button>
        </div>
      </div>
    </div>
    <div id="tooltip" class="hidden"></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
